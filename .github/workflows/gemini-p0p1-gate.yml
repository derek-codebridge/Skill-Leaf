name: Gemini P0/P1 gate

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
      force:
        description: Skip the Codex sign-off and author checks
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  id-token: write

concurrency:
  group: gemini-p0p1-gate-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       contains(github.event.comment.body, 'codex-pull-request-review-summary'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/85713166752/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: codebridge@seo-tools-claude.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: false
      - name: Gemini review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GOOGLE_PROJECT: seo-tools-claude
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GATE_AUTHORS: ${{ vars.GATE_AUTHORS }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GATE_FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/gemini_p0p1_gate.py
